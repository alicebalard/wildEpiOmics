notes: |
    "Our goal was to probe the mechanistic bases of environmental coping in this species by simultaneously studying physiological and molecular flexibility in the same individuals when moved from a natural setting to a more stressful setting in captivity. After birds were transferred from the wild to captivity, we wanted to (i) determine whether baseline and stress-induced corticosterone both exhibited phenotypic flexibility and (ii) identify environmentally responsive regions of the superb starling genome that exhibit epigenetic flexibility." NB: repeated sampling on the same individuals (total samples 68)
