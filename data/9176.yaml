notes: |
    Cross-fostering experiment comparing WGBS methylation in nestling erythrocytes (~16 days old)  raised by pairs (2 carers, n=28) vs. cooperative groups (3+ carers, mean 4.3 ± 1.4). 570 differentially methylated CpG sites (487 genes); 85% hypermethylated in group-reared nestlings. Genes related to metabolism, growth, stress response, and sociality regulation. DNA samples are extracted from ~16d chestnut-crowned babbler nestlings. Nestlings were either raised by parents or cooperative groups
